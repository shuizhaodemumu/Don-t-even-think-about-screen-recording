Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AutoAddGPU" "false"
    Option "AutoBindGPU" "false"
    Option "DontVTSwitch" "true"
    Option "AllowEmptyInput" "true"
EndSection
Section "Device"
    Identifier "test-card"
    Driver "dummy"
    VideoRam 8192
EndSection
Section "Monitor"
    Identifier "test-screen"
    HorizSync 15-160
    VertRefresh 20-240
    Modeline "320x240test" 12.5 320 340 372 400 240 244 247 260
EndSection
Section "Screen"
    Identifier "Display"
    Device "test-card"
    Monitor "test-screen"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "320x240test"
        Virtual 320 240
    EndSubSection
EndSection
Section "Module"
    Disable "glx"
EndSection
